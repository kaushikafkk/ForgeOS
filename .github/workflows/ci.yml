name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -buildvcs=false ./cmd/forge ./cmd/forged
      - name: Validate native Forge Hub
        run: python3 -m py_compile config/includes.chroot/usr/bin/forge-hub
      - name: Validate session scripts
        run: |
          sh -n config/includes.chroot/usr/bin/forgeos-session-setup
          sh -n config/includes.chroot/usr/bin/forge-shell-welcome
          sh -n config/hooks/live/010-forgeos-users.hook.chroot
      - name: Validate OS configuration
        run: bash scripts/validate-config.sh
